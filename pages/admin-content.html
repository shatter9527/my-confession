<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正文编辑 · My Confession</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/site.js" defer></script>
</head>
<body class="editor-page">

<div class="bar editor-bar">
    <h1>✎ 正文编辑</h1>
    <input type="password" id="token" placeholder="管理口令" autocomplete="off" aria-label="管理口令">
    <button id="btn-token">载入</button>
    <select aria-label="选择编辑页面" id="page"><option value="">— 选择页面 —</option></select>
    <button id="btn-save">保存</button>
    <button id="btn-reset" class="warn">恢复默认</button>
    <button id="btn-history" class="gray">历史版本</button>
    <button id="btn-reload" class="gray">重新载入</button>
    <a href="admin.html">← 回审核台</a>
</div>
<div class="msg" id="msg" role="status">先粘贴管理口令，再选一个页面。</div>
<div id="history" class="hidden"></div>
<iframe id="frame" src="about:blank" title="正文编辑预览"></iframe>

<script>
(function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var token = localStorage.getItem('mf_admin_token') || '';
    $('token').value = token;
    var current = '';
    var pagePath = {};

    function setMsg(t, cls) {
        $('msg').textContent = t || '';
        $('msg').className = 'msg' + (cls ? ' ' + cls : '');
    }

    function api(path, opt) {
        opt = opt || {};
        opt.headers = Object.assign({ 'x-admin-token': token }, opt.headers || {});
        return fetch(path, opt).then(function (r) {
            return r.json().then(function (j) { return { status: r.status, body: j }; });
        });
    }
    function post(path, payload) {
        return api(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload || {})
        });
    }

    function loadPages() {
        if (!token) { setMsg('先粘贴管理口令再点「载入」', 'err'); return; }
        api('/api/admin/pages').then(function (r) {
            if (r.status === 401) { setMsg('口令不正确', 'err'); return; }
            if (!r.body || !r.body.ok) { setMsg('读取页面列表失败', 'err'); return; }
            localStorage.setItem('mf_admin_token', token);
            var sel = $('page');
            sel.textContent = '';
            var opt0 = document.createElement('option');
            opt0.value = ''; opt0.textContent = '— 选择页面 —';
            sel.appendChild(opt0);
            r.body.pages.forEach(function (p) {
                var o = document.createElement('option');
                o.value = p.page;
                pagePath[p.page] = p.path || p.page;
                o.textContent = p.page + (p.edited ? '（已改过）' : '');
                sel.appendChild(o);
            });
            $('btn-token').disabled = true;
            setMsg('选择页面开始编辑；正文区域点进去就能直接改字。', 'ok');
        }).catch(function () { setMsg('连不上服务', 'err'); });
    }

    function enableEditing() {
        var fr = $('frame');
        var doc;
        try { doc = fr.contentDocument; } catch (e) { setMsg('无法访问页面内容（跨域）', 'err'); return; }
        if (!doc) { return; }
        var box = doc.querySelector('.content-left');
        if (!box) { setMsg('这个页面没有可编辑的正文区', 'err'); return; }

        // 编辑期禁用链接跳转
        doc.addEventListener('click', function (e) {
            var a = e.target.closest && e.target.closest('a');
            if (a) { e.preventDefault(); }
        }, true);

        box.setAttribute('contenteditable', 'true');
        box.style.outline = '2px dashed var(--accent)';
        box.style.outlineOffset = '6px';
        box.title = '这一整块可以直接编辑';

        setMsg('已进入编辑：点进正文改字即可，改完点「保存」。', 'ok');
    }

    function openPage(page) {
        if (!page) { $('frame').src = 'about:blank'; return; }
        current = page;
        $('history').classList.add('hidden');
        $('frame').src = '/' + (pagePath[page] || page) + '?edit=' + Date.now();
    }

    $('frame').addEventListener('load', function () {
        if (!current) { return; }
        // Wait for the actual override request, even on a slow connection.
        Promise.resolve($('frame').contentWindow.MFContentReady).then(enableEditing);
    });

    $('btn-token').addEventListener('click', function () {
        token = $('token').value.trim();
        $('btn-token').disabled = false;
        loadPages();
    });
    $('token').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { $('btn-token').click(); }
    });
    $('page').addEventListener('change', function () { openPage(this.value); });
    $('btn-reload').addEventListener('click', function () {
        if (!current) { setMsg('先选一个页面', 'err'); return; }
        openPage(current);
    });

    $('btn-save').addEventListener('click', function () {
        if (!current) { setMsg('先选一个页面', 'err'); return; }
        var fr = $('frame');
        var box = fr.contentDocument && fr.contentDocument.querySelector('.content-left');
        if (!box) { setMsg('拿不到正文内容', 'err'); return; }
        var clean = box.cloneNode(true);
        clean.querySelectorAll('.cmt-bar, .cmt-box').forEach(function (node) { node.remove(); });
        var html = clean.innerHTML;
        if (!confirm('保存后，所有访客看到的「' + current + '」正文都会变成现在这样。\n旧版本会自动存进历史，可以随时恢复。\n\n确定保存？')) { return; }
        post('/api/admin/content/' + encodeURIComponent(current), { html: html }).then(function (r) {
            if (r.body && r.body.ok) { setMsg('已保存（' + current + '）', 'ok'); }
            else { setMsg((r.body && r.body.error) || '保存失败', 'err'); }
        }).catch(function () { setMsg('连不上服务', 'err'); });
    });

    $('btn-reset').addEventListener('click', function () {
        if (!current) { setMsg('先选一个页面', 'err'); return; }
        if (!confirm('恢复成 HTML 文件里的原始内容？\n当前的编辑会进历史，可以再恢复回来。')) { return; }
        post('/api/admin/content-reset', { page: current }).then(function (r) {
            if (r.body && r.body.ok) { setMsg('已恢复默认', 'ok'); openPage(current); }
            else { setMsg((r.body && r.body.error) || '恢复失败', 'err'); }
        });
    });

    $('btn-history').addEventListener('click', function () {
        if (!current) { setMsg('先选一个页面', 'err'); return; }
        api('/api/admin/content/' + encodeURIComponent(current)).then(function (r) {
            if (!r.body || !r.body.ok) { setMsg('读取历史失败', 'err'); return; }
            var box = $('history');
            box.textContent = '';
            var list = r.body.history || [];
            if (!list.length) {
                var p = document.createElement('div');
                p.textContent = '还没有历史版本';
                box.appendChild(p);
            }
            list.forEach(function (h) {
                var d = document.createElement('div');
                var t = document.createElement('span');
                t.className = 't';
                t.textContent = new Date(h.saved_at).toLocaleString();
                var b = document.createElement('span');
                b.textContent = '恢复这版';
                b.style.color = 'var(--accent)';
                d.appendChild(t); d.appendChild(b);
                d.addEventListener('click', function () {
                    if (!confirm('恢复到这个时间点的版本？当前内容会先进历史。')) return;
                    post('/api/admin/content-history', { id: h.id }).then(function (rr) {
                        if (rr.body && rr.body.ok) {
                            box.classList.add('hidden');
                            setMsg('已恢复到 ' + new Date(h.saved_at).toLocaleString(), 'ok');
                            openPage(current);
                        } else { setMsg('恢复失败', 'err'); }
                    });
                });
                box.appendChild(d);
            });
            box.classList.remove('hidden');
        });
    });

    if (token) { loadPages(); }
})();
</script>
</body>
</html>
